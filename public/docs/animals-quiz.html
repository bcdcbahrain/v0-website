<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🦁 Animals Quiz</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #f0f5fb;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 2rem 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            max-width: 1050px;
            width: 100%;
            background: white;
            border-radius: 40px;
            box-shadow: 0 20px 50px -8px rgba(0, 20, 40, 0.18);
            padding: 2.2rem;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #0a2a3f;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            border-bottom: 3px solid #dce6ef;
            padding-bottom: 0.8rem;
            margin-bottom: 0.6rem;
        }
        h1 .badge {
            font-size: 0.9rem;
            font-weight: 500;
            color: #2a6b8a;
            background: #dce8f2;
            padding: 0.15rem 1.2rem;
            border-radius: 60px;
        }
        .subhead {
            color: #3d6a84;
            margin-bottom: 1.8rem;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
        }
        .stats {
            background: #eaf1f8;
            padding: 0.3rem 1.2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #1a4058;
        }
        .stats span {
            background: white;
            padding: 0.05rem 0.7rem;
            border-radius: 40px;
            margin: 0 0.1rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 0.9rem;
            margin: 1.5rem 0 1.8rem;
        }
        .animal-card {
            background: #f8fbfe;
            border: 2px solid #e2ebf3;
            border-radius: 20px;
            padding: 0.9rem 0.5rem 0.7rem;
            text-align: center;
            cursor: pointer;
            transition: 0.15s;
            user-select: none;
        }
        .animal-card:hover {
            transform: translateY(-4px);
            border-color: #8bb3cc;
            box-shadow: 0 8px 18px rgba(0, 40, 70, 0.1);
        }
        .animal-card .animal-img {
            width: 72px;
            height: 72px;
            object-fit: contain;
            margin: 0 auto 0.5rem;
            display: block;
        }
        .animal-card .status {
            font-size: 0.8rem;
            font-weight: 700;
            display: block;
            margin-top: 0.25rem;
        }
        .animal-card .status.correct { color: #1f8b5e; }
        .animal-card .status.wrong   { color: #b13e4b; }
        .animal-card .status.pending { color: #8a9aa8; }
        .animal-card.answered-correct {
            background: #e6f5ef;
            border-color: #309b6b;
        }
        .animal-card.answered-wrong {
            background: #fde9eb;
            border-color: #c95a66;
        }
        .reset-btn {
            background: #1a5f82;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 0.65rem 2rem;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 4px 12px rgba(26, 95, 130, 0.2);
        }
        .reset-btn:hover {
            background: #0f4866;
            transform: scale(0.97);
        }
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 0.8rem;
        }
        .footnote {
            margin-top: 1.8rem;
            border-top: 2px solid #dce8f2;
            padding-top: 1.2rem;
            font-size: 0.85rem;
            color: #4f6f84;
            text-align: center;
        }
        @media (max-width: 600px) {
            .card { padding: 1.3rem; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
            h1 { font-size: 1.7rem; }
            .animal-card .animal-img { width: 60px; height: 60px; }
        }
    </style>
</head>
<body>
<div class="card">
    <h1>
        🦁 Animals Quiz
        <span class="badge" id="totalBadge">36 animals</span>
    </h1>
    <div class="subhead">
        <span>Click any animal and type its name</span>
        <span class="stats">
            ✅ <span id="correctCount">0</span> &nbsp;·&nbsp;
            ❌ <span id="wrongCount">0</span> &nbsp;·&nbsp;
            ⏳ <span id="remainingCount">36</span>
        </span>
    </div>

    <div class="grid" id="gridContainer"></div>

    <div class="footer">
        <button class="reset-btn" id="resetBtn">🔄 Reset Quiz</button>
        <span style="font-size:0.85rem; color:#4f6f84;">💡 Type the name of the animal</span>
    </div>

    <div class="footnote">
        <i>Clear Twemoji images · Perfect for young learners</i>
    </div>
</div>

<script>
(function() {
    // Only animals with clear, distinct & correct Twemoji images
    const ANIMALS = [
        { name: "Dog",          img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f415.png" },
        { name: "Cat",          img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f408.png" },
        { name: "Mouse",        img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f401.png" },
        { name: "Hamster",      img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f439.png" },
        { name: "Rabbit",       img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f407.png" },
        { name: "Fox",          img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f98a.png" },
        { name: "Bear",         img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f43b.png" },
        { name: "Panda",        img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f43c.png" },
        { name: "Koala",        img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f428.png" },
        { name: "Tiger",        img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f405.png" },
        { name: "Lion",         img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f981.png" },
        { name: "Cow",          img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f404.png" },
        { name: "Pig",          img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f416.png" },
        { name: "Frog",         img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f438.png" },
        { name: "Monkey",       img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f412.png" },
        { name: "Chicken",      img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f414.png" },
        { name: "Penguin",      img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f427.png" },
        { name: "Bird",         img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f426.png" },
        { name: "Baby Chick",   img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f424.png" },
        { name: "Duck",         img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f986.png" },
        { name: "Eagle",        img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f985.png" },
        { name: "Owl",          img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f989.png" },
        { name: "Bat",          img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f987.png" },
        { name: "Wolf",         img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f43a.png" },
        { name: "Boar",         img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f417.png" },
        { name: "Horse",        img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f40e.png" },
        { name: "Unicorn",      img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f984.png" },
        { name: "Zebra",        img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f993.png" },
        { name: "Deer",         img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f98c.png" },
        { name: "Camel",        img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f42b.png" },
        { name: "Giraffe",      img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f992.png" },
        { name: "Elephant",     img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f418.png" },
        { name: "Rhinoceros",   img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f98f.png" },
        { name: "Hippopotamus", img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f99b.png" },
        { name: "Mouse",        img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f42d.png" },
        { name: "Snake",        img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f40d.png" }
    ];

    let answered = {};

    const grid = document.getElementById('gridContainer');
    const correctSpan = document.getElementById('correctCount');
    const wrongSpan = document.getElementById('wrongCount');
    const remainingSpan = document.getElementById('remainingCount');
    const totalBadge = document.getElementById('totalBadge');

    totalBadge.textContent = ANIMALS.length + " animals";

    function updateStats() {
        let correct = 0, wrong = 0;
        for (const key in answered) {
            if (answered[key] === 'correct') correct++;
            else if (answered[key] === 'wrong') wrong++;
        }
        correctSpan.textContent = correct;
        wrongSpan.textContent = wrong;
        remainingSpan.textContent = ANIMALS.length - correct - wrong;
    }

    function renderGrid() {
        grid.innerHTML = '';
        ANIMALS.forEach((animal) => {
            const card = document.createElement('div');
            card.className = 'animal-card';
            const status = answered[animal.name] || 'pending';

            if (status === 'correct') card.classList.add('answered-correct');
            else if (status === 'wrong') card.classList.add('answered-wrong');

            const img = document.createElement('img');
            img.className = 'animal-img';
            img.src = animal.img;
            img.alt = 'Animal';
            img.loading = 'lazy';

            const statusSpan = document.createElement('span');
            statusSpan.className = `status ${status}`;
            statusSpan.textContent = status === 'correct' ? '✅' :
                                     status === 'wrong'   ? '❌' : '⏳';

            card.appendChild(img);
            card.appendChild(statusSpan);

            card.addEventListener('click', () => {
                if (answered[animal.name]) return;

                const userAnswer = prompt(`What is the name of this animal?`);
                if (userAnswer === null) return;

                const trimmed = userAnswer.trim().toLowerCase();
                if (!trimmed) {
                    alert('Please type a name.');
                    return;
                }

                const correct = animal.name.toLowerCase();
                const isCorrect = trimmed === correct || 
                                  trimmed === correct + 's' ||
                                  (correct.includes(' ') && trimmed === correct.split(' ')[0]);

                answered[animal.name] = isCorrect ? 'correct' : 'wrong';
                renderGrid();
                updateStats();

                if (isCorrect) {
                    alert(`✅ Correct! It is a ${animal.name}.`);
                } else {
                    alert(`❌ The correct answer is "${animal.name}".`);
                }
            });

            grid.appendChild(card);
        });
        updateStats();
    }

    document.getElementById('resetBtn').addEventListener('click', () => {
        answered = {};
        renderGrid();
    });

    renderGrid();
})();
</script>
</body>
</html>
